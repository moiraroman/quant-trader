ai:
  analysis:
    daily_report_time: '18:00'
    market_analysis: true
    stock_screening: true
    strategy_recommendation: true
    weekly_report_day: friday
  llm:
    api_base: ''
    api_key: ''
    enable: false
    max_tokens: 2000
    model: gpt-4o-mini
    provider: openai
    temperature: 0.7
backtest:
  benchmark: SPY
  end_date: '2024-12-31'
  initial_capital: 100000
  output_dir: output/
  start_date: '2023-01-01'
data:
  moomoo:
    api_key: ''
    app_secret: ''
    enable: false
    host: 127.0.0.1
    log_level: INFO
    paper_trade: true
    port: 11111
    srv_proxy_addr: ''
    timeout_seconds: 30
    trade_pwd: ''
  yf:
    auto_update: false
    cache_dir: data_cache/
    cache_expire_hours: 24
    default_interval: 1d
    default_period: 2y
    default_ticker: AAPL
    update_interval_minutes: 30
logging:
  backup_count: 5
  console: true
  file: logs/quant_trader.log
  level: INFO
  max_bytes: 10485760
notification:
  email:
    enable: false
    from_addr: ''
    smtp_host: ''
    smtp_password: ''
    smtp_port: 587
    smtp_user: ''
    to_addrs: []
  enable: false
  telegram:
    bot_token: ''
    chat_id: ''
    enable: false
  triggers:
    on_daily_report: true
    on_error: true
    on_risk_alert: true
    on_signal: true
    on_trade: true
  wechat:
    enable: false
    webhook_url: ''
optimization:
  cv_folds: 5
  enable: false
  method: grid
  n_trials: 100
  output_dir: optimization/
  scoring: sharpe
risk:
  daily_loss_stop_pct: 0.1
  enable_hard_stop: true
  enable_hard_take_profit: true
  hard_stop_loss_pct: 0.05
  hard_take_profit_pct: 0.2
  max_consecutive_losses: 5
  max_loss_per_trade_pct: 0.05
  max_position_pct: 0.2
  max_total_position_pct: 0.8
  rsi_take_profit_threshold: 70
  stop_loss_atr_mult: 2.0
  take_profit_atr_mult: 8.0
scheduler:
  daily_analysis_cron: 0 18 * * 1-5
  data_update_cron: 0 */30 9-16 * * 1-5
  enable: false
  weekly_report_cron: 0 18 * * 5
screening:
  factor_weights:
    ma_deviation: 0.1
    momentum: 0.25
    rsi: 0.15
    trend: 0.2
    volatility: 0.15
    volume: 0.15
  params:
    atr_period: 14
    ma_long_period: 50
    ma_short_period: 20
    momentum_long_period: 20
    momentum_short_period: 5
    rsi_period: 14
    volume_avg_period: 20
  thresholds:
    max_score_sell: 40
    min_score_buy: 70
    momentum_strong: 0.7
    momentum_weak: 0.3
    rsi_overbought: 70
    rsi_oversold: 35
    trend_bear: 0.4
    trend_bull: 0.6
strategy:
  ai:
    feature_window: 60
    model_type: lightgbm
    prediction_horizon: 5
    signal_threshold: 0.6
  default:
    commission: 0.001
    initial_cash: 100000.0
    slippage: 0.0005
    symbol: AAPL
  technical:
    bb_period: 20
    bb_std: 2
    rsi_overbought: 70
    rsi_oversold: 30
    rsi_period: 14
    sma_long: 50
    sma_short: 10
